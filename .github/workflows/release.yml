# 태그(v0.1.0 등)를 푸시하면 macOS universal DMG와 Windows 설치 파일을 빌드해
# 같은 이름의 GitHub Release(초안)에 올린다. 서명은 하지 않는다(macOS는 ad-hoc 서명).
#
#   1) src-tauri/tauri.conf.json 의 version 을 올리고 커밋
#   2) git tag v0.1.1 && git push origin v0.1.1
#   3) Actions가 끝나면 Releases 탭에서 초안을 확인하고 Publish
name: release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: 태그와 앱 버전 일치 확인
        shell: bash
        run: |
          app_version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v${app_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::태그 ${GITHUB_REF_NAME} 와 tauri.conf.json version ${app_version} 이 다릅니다."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 프론트엔드 의존성 설치
        run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: PR Review Agent ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          releaseBody: |
            ## 설치

            **macOS** (Apple Silicon / Intel 공용): `*_universal.dmg`
            서명·공증되지 않은 앱이라 처음 실행 시 macOS가 막습니다. 둘 중 하나로 여세요.
            - 시스템 설정 → 개인정보 보호 및 보안 → 하단 "그래도 열기"
            - 또는 터미널: `xattr -dr com.apple.quarantine "/Applications/PR Review Agent.app"`

            **Windows**: `*_x64-setup.exe` 또는 `*_x64_en-US.msi`
            SmartScreen 경고가 뜨면 "추가 정보 → 실행"을 누르세요.
